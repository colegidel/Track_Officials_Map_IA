const colors={Central:'#9d6930',Northeast:'#276868',Northwest:'#4269a2',Southeast:'#855673',Southwest:'#617844'};

const fullName=o=>o.firstName+' '+o.lastName;
const mobileContact=el('io-mobile-contact');
const mobileQuery=window.matchMedia('(max-width:760px)');
function closeMobileContact(){if(mobileContact.open)mobileContact.close();}

const search=el('io-search'), certified=el('io-certified'), results=el('io-results');
const stateBounds=[[40.375,-96.65],[43.55,-90.1]];
let map,markers,regionLayer,filtered=[];
const regionSelect=el("io-region");
function selectRegion(region,focusRegion=false){regionSelect.value=region;draw();region?fitRegion(region):fitIowa();if(focusRegion)regionSelect.focus({preventScroll:true});}
function fitIowa(){if(map) map.fitBounds(stateBounds,{padding:[18,18]});}
function fitRegion(region){if(!map)return;const bounds=L.latLngBounds([]);regionLayer.eachLayer(l=>{if(l.feature.properties.region===region)bounds.extend(l.getBounds());});filtered.forEach(o=>bounds.extend([o.lat,o.lng]));if(bounds.isValid()){const fittedZoom=map.getBoundsZoom(bounds,false,L.point(48,48));map.setView(bounds.getCenter(),Math.min(fittedZoom+1,map.getMaxZoom()));}}
function regionStyle(f){const r=f.properties.region;const active=regionSelect.value;return {className:'io-region-shape',color:colors[r],weight:1.5,opacity:active?(active===r?.75:0):.75,fillColor:colors[r],fillOpacity:active?(active===r?.14:0):.14};}
const pinById=new Map();
function notice(text){el('io-notice').textContent=text;el('io-notice').style.display='block';}
function card(o){return `<article class="io-contact"><h2>${esc(fullName(o))}</h2><p>${o.certified?'Certified Starter':'Standard Official'}</p><p>${esc(o.city)}, ${esc(o.state)} · ${esc(o.zip)} · ${esc(o.region)} Region</p><p>${o.phone?esc(o.phone):"Phone not verified"}<br>${esc(o.email)}</p><div class="io-links">${o.phone?`<a href="tel:${o.phone.replace(/[^\d+]/g,'')}" aria-label="Call ${esc(fullName(o))}">Call</a>`:""}<a href="mailto:${esc(o.email)}" aria-label="Email ${esc(fullName(o))}">Email</a></div></article>`;}

function fit(){if(map&&filtered.length)map.fitBounds(filtered.map(o=>[o.lat,o.lng]),{padding:[40,40],maxZoom:10});}
function choose(o){highlight(o.id);if(!map){notice('Map unavailable. Contact details appear below.');el('io-map').innerHTML=card(o);return;}const marker=pinById.get(o.id);map.setView([o.lat,o.lng],Math.max(map.getZoom(),10));marker.setPopupContent(`<div class="io-popup-heading">${esc(o.city)} · ZIP ${o.zip.slice(0,5)}</div>${card(o)}<p style="font-size:11px;color:#687680">${o.approxCity?"Approximate city location":"Approximate ZIP-area location"}</p>`).openPopup();}
function draw(){
 closeMobileContact();
 const q=search.value.trim().toLowerCase();
 filtered=officials.filter(o=>(!certified.checked||o.certified)&&(!regionSelect.value||o.region===regionSelect.value)&&`${fullName(o)} ${o.city} ${o.zip}`.toLowerCase().includes(q)).sort((a,b)=>a.lastName.localeCompare(b.lastName)||a.firstName.localeCompare(b.firstName));

 if(regionLayer){regionLayer.setStyle(regionStyle);regionLayer.eachLayer(l=>{

 });}

 results.replaceChildren();

 filtered.forEach(o=>{const b=document.createElement('button');b.type='button';b.className='io-result';b.dataset.id=o.id;b.setAttribute('aria-pressed','false');b.setAttribute('aria-label',`View ${fullName(o)}, ${o.city}`);b.innerHTML=`<span class="io-avatar" aria-hidden="true">${esc(o.firstName[0]+o.lastName[0])}</span><span><span class="io-person">${esc(fullName(o))}</span><span class="io-place">${esc(o.city)} · ${esc(o.zip.slice(0,5))}</span><span class="io-status ${o.certified?'':'unknown'}">${o.certified?'✓ Certified Starter':'Standard Official'}</span></span><span class="io-arrow" aria-hidden="true">›</span>`;b.addEventListener('click',()=>choose(o));results.append(b);});

 const groups=new Map();filtered.forEach(o=>{const zip=o.zip.slice(0,5);if(!groups.has(zip))groups.set(zip,[]);groups.get(zip).push(o);});
 groups.forEach((group,zip)=>{const hasCertified=group.some(o=>o.certified);const icon=L.divIcon({className:`io-marker ${group.length===1?'single':''} ${hasCertified?'':'unknown'}`,html:`<span>${group.length>1?group.length:''}</span>`,iconSize:[30,30],iconAnchor:[15,15]});
 const m=L.marker([group[0].lat,group[0].lng],{icon,title:`ZIP ${zip}: ${group.length} ${group.length===1?'official':'officials'}`,alt:`Show officials in ZIP ${zip}`,keyboard:true}).addTo(markers);
 const popup=()=>`<div class="io-popup-heading">ZIP ${zip} · ${group.length} ${group.length===1?'official':'officials'}</div>${group.map(card).join('')}<p style="font-size:11px;color:#687680">${group[0].approxCity?"Approximate city location":"Approximate ZIP-area location"}</p>`;
 m.bindPopup(popup(),{maxWidth:320,minWidth:280,autoPan:!mobileQuery.matches});m.on('click',()=>{m.setPopupContent(popup());highlight(group.length===1?group[0].id:null);});
 m.getElement().setAttribute("aria-label",`ZIP ${zip}: ${group.length} ${group.length===1?"official":"officials"}`);
 m.bindTooltip(`${esc(group[0].city)} · ${group.length} ${group.length===1?'official':'officials'}`,{direction:'top'});group.forEach(o=>pinById.set(o.id,m));
 });
}
if(window.L){

  if(!mobileQuery.matches)return;
  el('io-mobile-contact-body').innerHTML=event.popup.getContent();

 if(location.protocol==='file:'){notice('For town labels and roads, open Start local preview.command from the download folder, or view this widget on your website. The background map cannot load reliably from a raw file.');}else{tiles.addTo(map);}
 let failures=0;tiles.on('tileerror',()=>{if(++failures===3){map.removeLayer(tiles);notice('Background map could not load. ZIP pins and contact listings are still available.');}});
 regionLayer=L.geoJSON(regions,{style:f=>({...regionStyle(f),className:'io-region-shape'}),onEachFeature:(f,l)=>{
 const r=f.properties.region;
 l.bindTooltip(r+' Region',{sticky:true});
 l.on('mouseover',()=>{if(!regionSelect.value)l.setStyle({fillOpacity:.25,weight:2});});
 l.on('mouseout',()=>regionLayer.resetStyle(l));
 l.on('click',()=>{if(!regionSelect.value)selectRegion(r,true);});
 }}).addTo(map);
 L.geoJSON(iowa,{interactive:false,style:{color:'#4b6c7c',weight:2,fillColor:'#d9e5df',fillOpacity:0.07}}).addTo(map);
 markers=L.layerGroup().addTo(map);

}else notice('The map library could not load. You can still search officials and select a name to view contact details.');
search.addEventListener('input',()=>{draw();fit();});
certified.addEventListener('change',()=>{draw();fit();});
regionSelect.addEventListener('change',()=>selectRegion(regionSelect.value));
function resetFilters(){search.value='';certified.checked=true;selectRegion('');}
el('io-reset').addEventListener('click',resetFilters);
el('io-reset-map').addEventListener('click',resetFilters);
function showFullRegion(){
 if(!map)return;
 const region=regionSelect.value;
 if(!region){fitIowa();return;}
 const bounds=L.latLngBounds([]);
 regionLayer.eachLayer(layer=>{if(layer.feature.properties.region===region)bounds.extend(layer.getBounds());});
 if(bounds.isValid())map.fitBounds(bounds,{padding:[24,24]});
}
el('io-fit').addEventListener('click',showFullRegion);
el('io-state').addEventListener('click',fitIowa);
fitIowa();draw();
})();
